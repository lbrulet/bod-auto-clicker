<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.25);
      cursor: crosshair;
      user-select: none;
      overflow: hidden;
    }
    #hint {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #4fc3f7;
      padding: 8px 18px;
      border-radius: 20px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      font-weight: 500;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid #4fc3f7;
    }
    #selection {
      position: absolute;
      border: 2px solid #4fc3f7;
      background: rgba(79, 195, 247, 0.12);
      display: none;
      pointer-events: none;
    }
    #size-label {
      position: absolute;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-family: monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <div id="hint">Drag to select a zone &nbsp;·&nbsp; Esc to cancel</div>
  <div id="selection"></div>
  <div id="size-label"></div>
  <script src="overlay.js"></script>
</body>
</html>
